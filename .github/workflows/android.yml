name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || python3 - <<'PY'
import os, json, urllib.request
log = open('build.log').read()[-5000:]
payload = json.dumps({"title": "Android build failure", "body": "```\n" + log + "\n```"}).encode()
req = urllib.request.Request(
    "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
    data=payload,
    headers={
        "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
    },
)
try:
    urllib.request.urlopen(req)
except Exception as e:
    print("issue create failed:", e)
PY
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-arena-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
